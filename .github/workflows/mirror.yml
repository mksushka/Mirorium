name: Mirror to GitLab

on: [push, delete]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH Redirect
        run: |
          mkdir -p ~/.ssh
          # Записываем наш секретный приватный ключ в виртуальную машину
          echo "${{ secrets.GITLAB_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Добавляем GitLab в список известных хостов, чтобы не было проверки Host Key
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Push to GitLab Mirror
        run: |
          # Принудительно пушим все ветки и теги напрямую через нативный git
          git push --prune git@gitlab.com:maximderevyanko87/mirorium.git +refs/heads/*:refs/heads/* +refs/tags/*:refs/tags/*
