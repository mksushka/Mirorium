name: Mirror to GitLab

on: [push, delete]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH Redirect
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITLAB_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Push to GitLab Mirror
        run: |
          # Отключаем строгую проверку старых объектов, чтобы пуш не падал из-за древней истории Git
          git config --global receive.fsckObjects false
          git config --global transfer.fsckObjects false
          
          # Пушим напрямую
          git push --prune git@gitlab.com:maximderevyanko87/mirorium.git +refs/heads/*:refs/heads/* +refs/tags/*:refs/tags/*
